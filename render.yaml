# Render Blueprint — backend API + web client, both on the free plan.
# Database lives on Neon (Render's free Postgres is deleted after 30 days).
# Deploys automatically on every push to master once CI passes.
# Values marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: trackit-api
    runtime: docker
    plan: free
    region: virginia
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: ITAU_STATEMENT_PDF_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MOBILE_RETURN_SCHEME
        value: trackit
      # The web client's host; OAuth may only send tokens back to it (or to
      # WEB_RETURN_ORIGINS, which defaults to the local Expo web ports).
      - key: WEB_APP_HOST
        fromService:
          type: web
          name: trackit-web
          property: host
      # Instance sleeps when idle — jobs come from .github/workflows/cron.yml.
      - key: SYNC_SCHEDULER_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO

  # Web client (ADR-009): the Expo app exported for the browser. It talks to
  # trackit-api through mobile/app.json → extra.apiUrl.
  - type: web
    name: trackit-web
    runtime: static
    branch: master
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
    # Single-page app: every path serves index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
